[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piaoliangbaobei"
version = "0.1.0"
description = "AI makeup and hairstyle transfer MVP backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
