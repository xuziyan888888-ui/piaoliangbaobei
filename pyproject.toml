[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piaoliangbaobei"
version = "0.1.0"
description = "AI makeup and hairstyle transfer MVP backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "numpy>=1.26,<2.0",
  "opencv-contrib-python>=4.11,<5.0",
  "pillow>=10.4,<12.0",
  "requests>=2.32,<3.0",
  "pytz>=2024.1,<2027.0",
  "pycryptodome>=3.20,<4.0",
  "volcengine>=1.0.224,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
